name: syntax-check

on:
  pull_request:
  push:
    branches: [main, "cursor/**"]

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in js/*.js; do
            echo "node --check $f"
            node --check "$f"
          done
