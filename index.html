<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>SpencerCraft — Mine, Build, Read!</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛏️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="game-canvas"></canvas>

<!-- ============ HOME SCREEN ============ -->
<div id="home">
  <h1>⛏️ SPENCERCRAFT</h1>
  <div class="subtitle">Mine! Build! Explore! (and become a reading legend)</div>
  <div id="home-rank">Lv 1 · Wood Explorer</div>
  <button class="mc-btn" id="btn-play">▶ PLAY</button>
  <button id="btn-home-parent">👨‍👩‍👧 GROWN-UPS (hold)</button>
</div>

<!-- ============ IN-GAME HUD ============ -->
<div id="hud">
  <div id="top-strip">
    <span class="pill" id="level-label">Lv 1</span>
    <span class="pill" id="rank-label">Wood Explorer</span>
    <div id="xp-bar"><div id="xp-fill"></div></div>
    <span class="pill" id="gems-label">💎 0</span>
  </div>
  <button id="btn-pause">☰</button>
  <div id="quest-hud"><span id="quest-hud-text"></span></div>

  <div id="crosshair"></div>
  <div id="mine-progress"><div id="mine-progress-fill"></div></div>
  <div id="toast"></div>

  <div id="joy-base"><div id="joy-knob"></div></div>
  <button class="action-btn" id="btn-jump">⬆️</button>
  <button class="action-btn" id="btn-mode">⛏️</button>
  <button id="btn-craft">⛏️ CRAFT!</button>
  <div id="hotbar"></div>
</div>

<!-- ============ MODAL OVERLAY (challenges, dialogue, menus) ============ -->
<div id="overlay"><div id="overlay-card"></div></div>

<!-- three.js (classic build so the game also works from file://) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="js/config.js"></script>
<script src="js/curriculum.js"></script>
<script src="js/save.js"></script>
<script src="js/audio.js"></script>
<script src="js/textures.js"></script>
<script src="js/world.js"></script>
<script src="js/learning.js"></script>
<script src="js/player.js"></script>
<script src="js/controls.js"></script>
<script src="js/npc.js"></script>
<script src="js/ui.js"></script>
<script src="js/reports.js"></script>
<script src="js/main.js"></script>
</body>
</html>
