<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WordCraft">
<title>WordCraft — Reading Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --sky1: #7ec8f5;
    --sky2: #b8e4ff;
    --grass: #6cbb3c;
    --grass-dark: #4e8f2a;
    --dirt: #8a5a2b;
    --dirt-dark: #6b4420;
    --stone: #8f8f8f;
    --stone-dark: #6e6e6e;
    --wood: #a0703c;
    --gold: #ffd83d;
    --diamond: #4ee1e6;
    --ui-dark: rgba(20, 24, 32, .82);
    --green-btn: #55c13f;
    --green-btn-dark: #3a8f2a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    font-family: 'Press Start 2P', 'Courier New', monospace;
    background: linear-gradient(var(--sky1), var(--sky2) 70%, var(--grass) 70%);
    color: #fff;
    display: flex;
    flex-direction: column;
  }
 
  /* ---------- shared blocky UI ---------- */
  .pixel-panel {
    background: var(--ui-dark);
    border: 4px solid #000;
    box-shadow: inset -4px -4px 0 rgba(0,0,0,.4), inset 4px 4px 0 rgba(255,255,255,.12);
    border-radius: 4px;
  }
  .btn {
    font-family: inherit;
    font-size: 18px;
    color: #fff;
    text-shadow: 2px 2px 0 rgba(0,0,0,.5);
    background: var(--green-btn);
    border: 4px solid #000;
    border-radius: 4px;
    box-shadow: inset -5px -5px 0 var(--green-btn-dark), inset 5px 5px 0 rgba(255,255,255,.35), 0 6px 0 #000;
    padding: 20px 34px;
    cursor: pointer;
    transition: transform .06s;
  }
  .btn:active { transform: translateY(4px); box-shadow: inset -5px -5px 0 var(--green-btn-dark), inset 5px 5px 0 rgba(255,255,255,.35), 0 2px 0 #000; }
  .btn.gray { background: var(--stone); box-shadow: inset -5px -5px 0 var(--stone-dark), inset 5px 5px 0 rgba(255,255,255,.35), 0 6px 0 #000; }
  .btn.gray:active { box-shadow: inset -5px -5px 0 var(--stone-dark), inset 5px 5px 0 rgba(255,255,255,.35), 0 2px 0 #000; }
  .btn.small { font-size: 12px; padding: 12px 18px; }
 
  .screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
  }
  .screen.active { display: flex; }
 
  /* ---------- clouds & scenery ---------- */
  .cloud {
    position: absolute;
    background: #fff;
    width: 90px; height: 28px;
    box-shadow: 22px -18px 0 6px #fff, 48px -8px 0 2px #fff;
    opacity: .9;
    animation: drift linear infinite;
    z-index: 0;
    border-radius: 3px;
  }
  @keyframes drift {
    from { transform: translateX(-150px); }
    to { transform: translateX(calc(100vw + 150px)); }
  }
  .sun-block {
    position: absolute;
    top: 26px; right: 34px;
    width: 64px; height: 64px;
    background: var(--gold);
    border: 4px solid #e0a800;
    box-shadow: 0 0 40px 12px rgba(255,216,61,.55);
    z-index: 0;
  }
 
  /* ---------- home screen ---------- */
  #home { justify-content: flex-start; z-index: 1; }
  .title {
    margin-top: 7vh;
    font-size: clamp(30px, 7vw, 56px);
    text-align: center;
    color: #fff;
    text-shadow: 4px 4px 0 #2c5e12, 8px 8px 0 rgba(0,0,0,.35);
    letter-spacing: 2px;
    z-index: 1;
    animation: bob 2.4s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .subtitle {
    margin-top: 14px;
    font-size: clamp(11px, 2.4vw, 15px);
    color: #1e3a0c;
    text-shadow: 1px 1px 0 rgba(255,255,255,.4);
    z-index: 1;
  }
  #playBtn {
    margin-top: 5vh;
    font-size: clamp(20px, 4.6vw, 30px);
    padding: 26px 60px;
    z-index: 2;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.15); } }
 
  .stats-row {
    display: flex;
    gap: 12px;
    margin-top: 26px;
    z-index: 1;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stat-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 18px;
    font-size: 14px;
  }
  .stat-chip .icon { font-size: 22px; }
 
  .xp-wrap { width: min(440px, 86vw); margin-top: 20px; z-index: 1; }
  .xp-label { font-size: 10px; margin-bottom: 6px; text-shadow: 1px 1px 0 #000; display: flex; justify-content: space-between; color:#fff; }
  .xp-bar {
    height: 26px;
    background: #222;
    border: 4px solid #000;
    border-radius: 4px;
    overflow: hidden;
  }
  .xp-fill {
    height: 100%;
    background: repeating-linear-gradient(90deg, #7ee63c 0 14px, #5fc22a 14px 28px);
    width: 0%;
    transition: width .6s ease;
  }
 
  /* world strip at bottom of home */
  #world {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 27vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: clamp(4px, 2vw, 20px);
    padding-bottom: 12.5vh;
    z-index: 1;
    pointer-events: none;
  }
  #world .build {
    font-size: clamp(30px, 7vw, 58px);
    filter: drop-shadow(3px 4px 0 rgba(0,0,0,.3));
    animation: pop-in .5s ease backwards;
  }
  @keyframes pop-in { from { transform: scale(0); } to { transform: scale(1); } }
  .ground {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 12vh;
    background:
      linear-gradient(var(--grass) 0 26%, var(--dirt) 26%),
      none;
    border-top: 5px solid var(--grass-dark);
    z-index: 0;
  }
  .ground::after {
    content: "";
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(90deg, transparent 0 62px, rgba(0,0,0,.12) 62px 64px),
      repeating-linear-gradient(0deg, transparent 0 30px, rgba(0,0,0,.08) 30px 32px);
  }
 
  /* ---------- game screen ---------- */
  #game { justify-content: flex-start; z-index: 2; }
  .hud {
    width: 100%;
    max-width: 760px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 2;
  }
  .hud .quit {
    font-size: 16px;
    padding: 10px 16px;
    background: var(--stone);
    box-shadow: inset -4px -4px 0 var(--stone-dark), inset 4px 4px 0 rgba(255,255,255,.3), 0 4px 0 #000;
  }
  .hearts { font-size: 15px; margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 10px 14px; }
  .progress-track {
    flex: 1;
    height: 24px;
    background: #222;
    border: 4px solid #000;
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: repeating-linear-gradient(90deg, var(--diamond) 0 14px, #2db8bd 14px 28px);
    width: 0%;
    transition: width .4s ease;
  }
 
  .prompt-area {
    margin-top: 3vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    z-index: 2;
    width: 100%;
    max-width: 760px;
  }
  .quest-label {
    font-size: clamp(11px, 2.4vw, 15px);
    color: #163d05;
    text-shadow: 1px 1px 0 rgba(255,255,255,.35);
  }
  .speak-btn {
    font-family: inherit;
    font-size: clamp(26px, 6vw, 40px);
    background: var(--gold);
    color: #5b3d00;
    border: 4px solid #000;
    border-radius: 4px;
    box-shadow: inset -5px -5px 0 #d8a800, inset 5px 5px 0 rgba(255,255,255,.5), 0 6px 0 #000;
    padding: 18px 30px;
    cursor: pointer;
  }
  .speak-btn:active { transform: translateY(4px); box-shadow: inset -5px -5px 0 #d8a800, inset 5px 5px 0 rgba(255,255,255,.5), 0 2px 0 #000; }
  .speak-hint { font-size: 10px; color: #163d05; text-shadow: 1px 1px 0 rgba(255,255,255,.3); }
 
  .big-emoji { font-size: clamp(56px, 13vw, 100px); filter: drop-shadow(3px 4px 0 rgba(0,0,0,.25)); }
 
  .sentence-card {
    padding: 22px 26px;
    font-size: clamp(17px, 4.2vw, 28px);
    line-height: 1.8;
    text-align: center;
    max-width: 92vw;
  }
 
  /* mining blocks */
  .choices {
    margin-top: 3.5vh;
    display: flex;
    flex-wrap: wrap;
    gap: clamp(14px, 3.5vw, 30px);
    justify-content: center;
    z-index: 2;
    width: 100%;
    max-width: 860px;
  }
  .block-choice {
    position: relative;
    width: clamp(120px, 26vw, 190px);
    height: clamp(120px, 26vw, 190px);
    font-family: inherit;
    font-size: clamp(18px, 4.4vw, 30px);
    color: #fff;
    text-shadow: 2px 2px 0 #000;
    background:
      linear-gradient(135deg, rgba(255,255,255,.16) 0 12%, transparent 12%),
      var(--stone);
    border: 5px solid #000;
    border-radius: 4px;
    box-shadow: inset -8px -8px 0 var(--stone-dark), inset 8px 8px 0 rgba(255,255,255,.22), 0 7px 0 #000;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .06s;
  }
  .block-choice:active { transform: scale(.96); }
  .block-choice.wrong { animation: wobble .5s ease; }
  @keyframes wobble {
    0%,100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-10px) rotate(-3deg); }
    40% { transform: translateX(10px) rotate(3deg); }
    60% { transform: translateX(-7px) rotate(-2deg); }
    80% { transform: translateX(7px) rotate(2deg); }
  }
  .block-choice.breaking {
    animation: shatter .55s ease forwards;
    background: var(--diamond);
    box-shadow: inset -8px -8px 0 #26a8ad, inset 8px 8px 0 rgba(255,255,255,.45), 0 7px 0 #000;
  }
  @keyframes shatter {
    0% { transform: scale(1); }
    30% { transform: scale(1.12) rotate(-2deg); }
    100% { transform: scale(0) rotate(10deg); opacity: 0; }
  }
  .crack-overlay {
    position: absolute; inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(45deg, transparent 47%, rgba(0,0,0,.55) 47% 53%, transparent 53%),
      linear-gradient(-38deg, transparent 46%, rgba(0,0,0,.45) 46% 52%, transparent 52%);
    opacity: 0;
  }
  .block-choice.cracked .crack-overlay { opacity: 1; }
 
  /* picture options for sentence game */
  .pic-choice {
    width: clamp(120px, 26vw, 190px);
    height: clamp(120px, 26vw, 190px);
    font-size: clamp(44px, 11vw, 76px);
    background: linear-gradient(#c9e8ff, #9fd0f0);
    border: 5px solid #000;
    border-radius: 4px;
    box-shadow: inset -8px -8px 0 #6fa8cc, inset 8px 8px 0 rgba(255,255,255,.55), 0 7px 0 #000;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .06s;
  }
  .pic-choice:active { transform: scale(.96); }
  .pic-choice.wrong { animation: wobble .5s ease; }
  .pic-choice.right { animation: bounce-win .6s ease; background: linear-gradient(#c4f5b0, #8ede6e); }
  @keyframes bounce-win {
    0% { transform: scale(1); }
    40% { transform: scale(1.2); }
    70% { transform: scale(.95); }
    100% { transform: scale(1.05); }
  }
 
  /* crafting game */
  .craft-slots {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(8px, 2vw, 14px);
    margin-top: 2vh;
    z-index: 2;
    max-width: 94vw;
  }
  .slot {
    width: clamp(56px, 13vw, 84px);
    height: clamp(56px, 13vw, 84px);
    background: #3b3b3b;
    border: 4px solid #000;
    border-radius: 4px;
    box-shadow: inset 4px 4px 0 rgba(0,0,0,.5), inset -3px -3px 0 rgba(255,255,255,.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(24px, 6vw, 40px);
    color: #fff;
    text-shadow: 2px 2px 0 #000;
    cursor: pointer;
    text-transform: uppercase;
  }
  .slot .ghost { opacity: .35; }
  .slot.filled { background: var(--wood); box-shadow: inset -4px -4px 0 #7a5028, inset 4px 4px 0 rgba(255,255,255,.3); }
  .craft-row.wrong .slot { animation: wobble .5s ease; }
  .letter-tray {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(8px, 2vw, 14px);
    justify-content: center;
    margin-top: 3.5vh;
    z-index: 2;
    max-width: 92vw;
  }
  .tile {
    width: clamp(58px, 13.5vw, 88px);
    height: clamp(58px, 13.5vw, 88px);
    font-family: inherit;
    font-size: clamp(24px, 6vw, 40px);
    color: #fff;
    text-shadow: 2px 2px 0 #000;
    text-transform: uppercase;
    background: var(--wood);
    border: 4px solid #000;
    border-radius: 4px;
    box-shadow: inset -6px -6px 0 #7a5028, inset 6px 6px 0 rgba(255,255,255,.3), 0 6px 0 #000;
    cursor: pointer;
    transition: transform .06s, opacity .2s;
  }
  .tile:active { transform: scale(.94); }
  .tile.used { opacity: .18; pointer-events: none; }
 
  /* feedback bubble */
  #feedback {
    position: absolute;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: clamp(22px, 5.5vw, 40px);
    color: var(--gold);
    text-shadow: 3px 3px 0 #000;
    z-index: 50;
    pointer-events: none;
    white-space: nowrap;
  }
  #feedback.show { animation: feedback-pop 1s ease forwards; }
  @keyframes feedback-pop {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
    35% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
    60% { transform: translate(-50%, -55%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -80%) scale(1); opacity: 0; }
  }
 
  /* particles */
  .particle {
    position: fixed;
    font-size: 24px;
    pointer-events: none;
    z-index: 60;
    animation: fly .9s ease-out forwards;
  }
  @keyframes fly {
    to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
  }
 
  /* ---------- summary / level up screens ---------- */
  #summary, #levelup { justify-content: center; z-index: 3; background: rgba(10, 14, 22, .78); }
  .chest {
    font-size: clamp(70px, 16vw, 120px);
    animation: chest-shake .5s ease 3, chest-open .6s ease 1.6s forwards;
    filter: drop-shadow(4px 6px 0 rgba(0,0,0,.4));
  }
  @keyframes chest-shake {
    0%,100% { transform: rotate(0); }
    25% { transform: rotate(-6deg); }
    75% { transform: rotate(6deg); }
  }
  @keyframes chest-open { to { transform: scale(1.15); } }
  .summary-title { font-size: clamp(20px, 5vw, 34px); margin-top: 20px; text-shadow: 3px 3px 0 #000; text-align: center; }
  .loot-row { display: flex; gap: 16px; margin-top: 26px; flex-wrap: wrap; justify-content: center; }
  .loot { padding: 16px 22px; font-size: 15px; display: flex; align-items: center; gap: 10px; }
  .loot .icon { font-size: 26px; }
  #levelup .rank-title { font-size: clamp(18px, 4.6vw, 30px); color: var(--gold); margin-top: 18px; text-shadow: 3px 3px 0 #000; text-align: center; line-height: 1.6; }
  #levelup .unlock-item { font-size: clamp(60px, 14vw, 110px); margin-top: 12px; animation: pop-in .5s ease backwards .3s; }
 
  /* ---------- parent corner ---------- */
  .parent-btn {
    position: absolute;
    right: 12px;
    bottom: max(10px, env(safe-area-inset-bottom));
    z-index: 5;
    font-family: inherit;
    font-size: 9px;
    line-height: 1.6;
    color: rgba(255,255,255,.85);
    background: rgba(20,24,32,.55);
    border: 3px solid rgba(0,0,0,.6);
    border-radius: 4px;
    padding: 8px 10px;
    cursor: pointer;
    text-align: center;
  }
  .parent-btn.holding { background: var(--gold); color: #333; }
  #parent { justify-content: center; z-index: 4; background: rgba(10, 14, 22, .82); }
  .parent-card {
    width: min(560px, 94vw);
    max-height: 86vh;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .parent-title { font-size: 16px; color: var(--gold); text-shadow: 2px 2px 0 #000; text-align: center; line-height: 1.6; }
  .parent-stats { margin-top: 16px; font-size: 11px; line-height: 2.2; width: 100%; }
  .parent-stats .row { display: flex; justify-content: space-between; gap: 12px; border-bottom: 2px solid rgba(255,255,255,.08); padding: 2px 0; }
  .parent-stats .row span:last-child { color: var(--diamond); text-align: right; }
  .parent-note { margin-top: 14px; font-size: 9px; line-height: 1.9; color: #ffd; text-align: center; }
 
  .hidden { display: none !important; }
</style>
</head>
<body>
 
<div class="sun-block"></div>
<div class="ground"></div>
 
<!-- ============ HOME ============ -->
<div id="home" class="screen active">
  <h1 class="title">WORDCRAFT</h1>
  <div class="subtitle" id="subtitle">⛏️ A READING ADVENTURE ⛏️</div>
  <button id="playBtn" class="btn">▶ PLAY</button>
  <div class="stats-row">
    <div class="pixel-panel stat-chip"><span class="icon">💎</span><span id="statDiamonds">0</span></div>
    <div class="pixel-panel stat-chip"><span class="icon">🏆</span><span id="statRank">Wood Miner</span></div>
  </div>
  <div class="xp-wrap">
    <div class="xp-label"><span id="xpLevelLabel">LEVEL 1</span><span id="xpNums">0 / 50 XP</span></div>
    <div class="xp-bar"><div id="xpFill" class="xp-fill"></div></div>
  </div>
  <div id="world"></div>
  <button id="parentBtn" class="parent-btn">👨‍👦 GROWN-UPS<br><span style="font-size:7px">(PRESS &amp; HOLD)</span></button>
</div>
 
<!-- ============ PARENT / PROGRESS ============ -->
<div id="parent" class="screen">
  <div class="pixel-panel parent-card">
    <div class="parent-title" id="parentTitle">PROGRESS REPORT</div>
    <div class="parent-stats" id="parentStats"></div>
    <div class="parent-note" id="reportStatus"></div>
    <div class="loot-row" style="margin-top:18px">
      <button id="sendReportBtn" class="btn small">📧 SEND REPORT NOW</button>
      <button id="parentBackBtn" class="btn small gray">BACK</button>
    </div>
  </div>
</div>
 
<!-- ============ GAME ============ -->
<div id="game" class="screen">
  <div class="hud">
    <button id="quitBtn" class="btn quit">✕</button>
    <div class="progress-track"><div id="progFill" class="progress-fill"></div></div>
    <div class="pixel-panel hearts">💎 <span id="hudDiamonds">0</span></div>
  </div>
  <div id="promptArea" class="prompt-area"></div>
  <div id="choiceArea" class="choices"></div>
</div>
 
<!-- ============ ADVENTURE COMPLETE ============ -->
<div id="summary" class="screen">
  <div class="chest">🧰</div>
  <div class="summary-title">ADVENTURE<br>COMPLETE!</div>
  <div class="loot-row">
    <div class="pixel-panel loot"><span class="icon">💎</span><span id="lootDiamonds">+0</span></div>
    <div class="pixel-panel loot"><span class="icon">⭐</span><span id="lootXP">+0 XP</span></div>
  </div>
  <div class="loot-row">
    <button id="againBtn" class="btn">PLAY AGAIN</button>
    <button id="homeBtn" class="btn gray">HOME</button>
  </div>
</div>
 
<!-- ============ LEVEL UP ============ -->
<div id="levelup" class="screen">
  <div class="summary-title">⬆ LEVEL UP! ⬆</div>
  <div class="rank-title" id="rankTitle"></div>
  <div class="unlock-item" id="unlockItem"></div>
  <div class="rank-title" style="font-size:12px" id="unlockText"></div>
  <div class="loot-row">
    <button id="levelupOk" class="btn">AWESOME!</button>
  </div>
</div>
 
<div id="feedback"></div>
 
<script>
"use strict";
 
/* =====================================================
   FAMILY SETTINGS — edit these!
   ===================================================== */
const CONFIG = {
  /* The player's name. Used in the title, praise, speech, and the
     "craft your name" bonus round. */
  PLAYER_NAME: "Spencer",
 
  /* Weekly email reports: create a free form at https://formspree.io
     (it emails submissions to you), then paste your endpoint here,
     e.g. "https://formspree.io/f/abcdwxyz". Leave "" to disable email —
     progress is always visible in the GROWN-UPS screen either way. */
  REPORT_ENDPOINT: "",
 
  /* How often to auto-send a report when the game is opened. */
  REPORT_EVERY_DAYS: 7
};
const NAME = CONFIG.PLAYER_NAME;
 
/* =====================================================
   WORD DATA — 3 difficulty tiers
   ===================================================== */
const WORDS = {

/* =====================================================

   ===================================================== */
let audioCtx = null;
function ctx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function tone(freq, start, dur, type, vol) {
  const c = ctx();
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type || "square";
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.12, c.currentTime + start);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + start + dur);
  o.connect(g).connect(c.destination);
  o.start(c.currentTime + start);
  o.stop(c.currentTime + start + dur + 0.05);
}
const sfx = {
  tap()     { tone(520, 0, .08, "square", .08); },
  breakBlock() {
    tone(220, 0, .1, "square", .12); tone(160, .06, .12, "sawtooth", .1);
    tone(660, .12, .18, "square", .1); tone(880, .2, .22, "square", .1);
  },
  wrong()   { tone(200, 0, .18, "sawtooth", .08); tone(150, .12, .22, "sawtooth", .07); },
  correct() { tone(523, 0, .1), tone(659, .09, .1); tone(784, .18, .2); },
  diamond() { tone(1047, 0, .09, "triangle", .14); tone(1319, .08, .09, "triangle", .14); tone(1568, .16, .2, "triangle", .14); },
  levelup() {
    [523, 587, 659, 784, 880, 1047].forEach((f, i) => tone(f, i * .11, .14, "square", .12));
    tone(1319, .66, .4, "triangle", .15);
  },
  chest()   { tone(392, 0, .12); tone(523, .12, .12); tone(659, .24, .25); }
};
 
let voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices().filter(v => v.lang.startsWith("en"));
  voice = vs.find(v => /Samantha|Karen|child|kid/i.test(v.name)) || vs[0] || null;
}
if ("speechSynthesis" in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function say(text, rate) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = rate || 0.8;
  u.pitch = 1.1;
  if (voice) u.voice = voice;
  speechSynthesis.speak(u);
}

const $ = id => document.getElementById(id);
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
}
function feedback(text) {
  const f = $("feedback");
  f.textContent = text;
  f.classList.remove("show");
  void f.offsetWidth;
  f.classList.add("show");
}
function burst(x, y, emoji, count) {
  for (let i = 0; i < (count || 10); i++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.textContent = emoji;
    p.style.left = x + "px";

    p.style.setProperty("--dx", (Math.random() * 260 - 130) + "px");
    p.style.setProperty("--dy", (Math.random() * -220 - 40) + "px");
    p.style.setProperty("--rot", (Math.random() * 540 - 270) + "deg");
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 950);
  }
}

/* =====================================================
   ADVENTURE ENGINE
   ===================================================== */
let round = 0;
let earnedXP = 0;
let earnedDiamonds = 0;
let mistakesThisRound = 0;
let levelBefore = 1;
let currentWord = null; /* word being practiced, for progress tracking */
 
function startAdventure() {
  round = 0;
  earnedXP = 0;
  earnedDiamonds = 0;
  levelBefore = level();
  $("hudDiamonds").textContent = save.diamonds;
  showScreen("game");
  nextRound();
}
 
function currentTier() { return save.tier; }
 
function tierUp(correctNoMistake) {
  if (correctNoMistake) {
    save.tierWins++;
    if (save.tierWins >= 12 && save.tier < 3) {
      save.tier++;
      save.tierWins = 0;
    }
  } else {
    save.tierWins = Math.max(0, save.tierWins - 1);
  }
}
 
/* Occasionally review an earlier tier so it stays fun/easy */
function roundTier() {
  const t = currentTier();
  if (t > 1 && Math.random() < 0.25) return t - 1;
  return t;
}
 
function nextRound() {
  if (round >= ROUNDS_PER_ADVENTURE) return endAdventure();
  round++;
  mistakesThisRound = 0;
  currentWord = null;
  $("progFill").style.width = ((round - 1) / ROUNDS_PER_ADVENTURE * 100) + "%";
  /* occasional bonus round: craft your own name (with tracing hints) */
  if (Math.random() < 0.14) return craftGame(1, { name: true });
  /* mining and crafting appear more often; sentence reading is sprinkled in */
  const g = pick([mineGame, mineGame, craftGame, craftGame, sentenceGame]);
  g(roundTier());
}
 
function winRound(clientX, clientY) {
  const noMistake = mistakesThisRound === 0;
  const gain = noMistake ? 15 : 10;
  earnedXP += gain;
  earnedDiamonds += 1;
  save.xp += gain;
  save.diamonds += 1;
  tierUp(noMistake);
  /* progress tracking for the weekly report */
  const st = save.stats;
  st.rounds++;
  st.totalRounds++;
  if (noMistake) st.perfect++;
  st.mistakes += mistakesThisRound;
  if (currentWord && mistakesThisRound > 0) {
    st.misses[currentWord] = (st.misses[currentWord] || 0) + mistakesThisRound;
  }
  const today = new Date().toISOString().slice(0, 10);
  if (!st.days.includes(today)) st.days.push(today);
  persist();
  $("hudDiamonds").textContent = save.diamonds;
  $("progFill").style.width = (round / ROUNDS_PER_ADVENTURE * 100) + "%";
  feedback(pick(PRAISE));
  sfx.diamond();
  burst(clientX || innerWidth / 2, clientY || innerHeight / 2, "💎", 8);
  setTimeout(nextRound, 1200);
}
 
function endAdventure() {
  $("lootDiamonds").textContent = "+" + earnedDiamonds;
  $("lootXP").textContent = "+" + earnedXP + " XP";
  showScreen("summary");
  sfx.chest();
  setTimeout(() => {
    burst(innerWidth / 2, innerHeight / 2.6, "💎", 14);
    burst(innerWidth / 2, innerHeight / 2.6, "⭐", 10);
  }, 1700);
  say("Adventure complete! Great mining, " + NAME + "!");
}
 
function maybeLevelUp() {
  const lv = level();
  if (lv > levelBefore && lv - 2 < RANKS.length) {
    const r = RANKS[Math.min(lv - 1, RANKS.length - 1)];
    const unlocked = RANKS[lv - 2]; /* build earned by finishing previous level */
    $("rankTitle").textContent = "YOU ARE NOW A " + r.name.toUpperCase() + "!";
    $("unlockItem").textContent = unlocked.item;
    $("unlockText").textContent = unlocked.text.toUpperCase();
    levelBefore = lv;
    showScreen("levelup");
    sfx.levelup();
    burst(innerWidth / 2, innerHeight / 3, "⭐", 14);
    say("Level up, " + NAME + "! You are now a " + r.name + "! " + unlocked.text);
    return true;
  }
  return false;
}
 
/* =====================================================
   GAME 1 — MINE THE WORD
   ===================================================== */
function mineGame(tier) {
  const pool = shuffle(WORDS[tier]);
  const target = pool[0];
  currentWord = target.w;
  const numChoices = tier === 1 ? 3 : 4;
  const options = shuffle(pool.slice(0, numChoices));
 
  $("promptArea").innerHTML = `
    <div class="quest-label">⛏️ MINE THE WORD! ⛏️</div>
    <button class="speak-btn" id="sayWord">🔊</button>
    <div class="speak-hint">TAP TO HEAR THE WORD</div>`;
  $("sayWord").addEventListener("click", () => { sfx.tap(); say(target.w); });
 
  const area = $("choiceArea");
  area.innerHTML = "";
  options.forEach(opt => {
    const b = document.createElement("button");
    b.className = "block-choice";
    b.innerHTML = `<span>${opt.w}</span><div class="crack-overlay"></div>`;
    b.addEventListener("click", ev => {
      if (b.dataset.done) return;
      if (opt.w === target.w) {
        b.dataset.done = "1";
        b.classList.add("breaking");
        sfx.breakBlock();
        area.querySelectorAll(".block-choice").forEach(x => x.style.pointerEvents = "none");
        burst(ev.clientX, ev.clientY, "🪨", 8);
        setTimeout(() => winRound(ev.clientX, ev.clientY), 500);
      } else {
        mistakesThisRound++;
        b.classList.remove("wrong");
        void b.offsetWidth;
        b.classList.add("wrong", "cracked");
        sfx.wrong();
        say(target.w);
      }
    });
    area.appendChild(b);
  });
  setTimeout(() => say(target.w), 400);
}
 
/* =====================================================
   GAME 2 — CRAFT THE WORD
   ===================================================== */
function craftGame(tier, special) {
  const isName = !!(special && special.name);
  let target;
  if (isName) {
    target = { w: NAME.toLowerCase(), e: "🤩" };
  } else {
    const pool = shuffle(WORDS[tier].filter(x => x.w.length <= (tier === 1 ? 3 : 5)));
    target = pool[0];
  }
  currentWord = isName ? null : target.w; /* name round isn't tracked as a tricky word */
  const letters = target.w.split("");
  let placed = [];
  /* name round starts with ghost tracing hints so it always feels like a win */
  let attempts = isName ? 1 : 0;
 
  $("promptArea").innerHTML = `
    <div class="quest-label">${isName ? "⭐ BONUS! CRAFT YOUR NAME! ⭐" : "🛠️ CRAFT THE WORD! 🛠️"}</div>
    <div class="big-emoji" id="craftEmoji">${target.e}</div>
    <button class="speak-btn" id="sayWord" style="font-size:22px;padding:12px 22px">🔊</button>
    <div class="craft-slots craft-row" id="slots"></div>`;
  $("sayWord").addEventListener("click", () => { sfx.tap(); say(isName ? NAME : target.w); });
 
  const slotsEl = $("slots");
  letters.forEach(() => {
    const s = document.createElement("div");
    s.className = "slot";
    slotsEl.appendChild(s);
  });
 
  /* decoy letters that are NOT in the word */
  const alphabet = "abcdefghijklmnopqrstuvwxyz";
  const decoys = [];
  while (decoys.length < 2) {
    const c = alphabet[Math.floor(Math.random() * 26)];
    if (!letters.includes(c) && !decoys.includes(c)) decoys.push(c);
  }
  const tiles = shuffle(letters.concat(decoys));
 
  const area = $("choiceArea");
  area.innerHTML = "";
  const tray = document.createElement("div");
  tray.className = "letter-tray";
  area.appendChild(tray);
 
  function renderSlots() {
    slotsEl.querySelectorAll(".slot").forEach((s, i) => {
      s.classList.toggle("filled", i < placed.length);
      if (i < placed.length) {
        s.textContent = placed[i].letter;
      } else if (attempts >= 1 && i === placed.length) {
        s.innerHTML = `<span class="ghost">${letters[i]}</span>`; /* hint after a miss */
      } else {
        s.textContent = "";
      }
    });
  }
 
  function checkDone(ev) {
    if (placed.length !== letters.length) return;
    const word = placed.map(p => p.letter).join("");
    if (word === target.w) {
      sfx.breakBlock();
      say(isName ? NAME + "! Awesome!" : target.w);
      burst(ev.clientX, ev.clientY, "✨", 10);
      slotsEl.style.pointerEvents = "none";
      tray.style.pointerEvents = "none";
      setTimeout(() => winRound(ev.clientX, ev.clientY), 700);
    } else {
      mistakesThisRound++;
      attempts++;
      sfx.wrong();
      slotsEl.parentElement.classList.remove("wrong");
      void slotsEl.offsetWidth;
      slotsEl.parentElement.classList.add("wrong");
      say(target.w);
      setTimeout(() => {
        placed.forEach(p => p.tile.classList.remove("used"));
        placed = [];
        renderSlots();
      }, 600);
    }
  }
 
  tiles.forEach(letter => {
    const t = document.createElement("button");
    t.className = "tile";
    t.textContent = letter;
    t.addEventListener("click", ev => {
      if (t.classList.contains("used") || placed.length >= letters.length) return;
      sfx.tap();
      say(letter);
      t.classList.add("used");
      placed.push({ letter, tile: t });
      renderSlots();
      checkDone(ev);
    });
    tray.appendChild(t);
  });
 
  /* tap slots to undo last letter */
  slotsEl.addEventListener("click", () => {
    if (!placed.length) return;
    sfx.tap();
    const last = placed.pop();
    last.tile.classList.remove("used");
    renderSlots();
  });
 
  renderSlots();
  setTimeout(() => say(target.w), 400);
}

function sentenceGame(tier) {
  const item = pick(SENTENCES[tier]);

  $("sayWord").addEventListener("click", () => { sfx.tap(); say(item.s, 0.75); });
 
  const area = $("choiceArea");
  area.innerHTML = "";
  options.forEach(opt => {
    const b = document.createElement("button");
    b.className = "pic-choice";
    b.textContent = opt;
    b.addEventListener("click", ev => {
      if (opt === item.a) {
        b.classList.add("right");

        setTimeout(() => winRound(ev.clientX, ev.clientY), 600);
      } else {

        b.classList.remove("wrong");
        void b.offsetWidth;
        b.classList.add("wrong");
        sfx.wrong();
        say(item.s, 0.75);
      }
    });
    area.appendChild(b);
  });
}

const TIER_DESC = {
  1: "short words like cat, pig, sun",
  2: "blends & digraphs like frog, ship, stop",
  3: "long vowels & sight words like snake, house, train"
};
function fmtDate(ms) {
  return new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function trickyWords(limit) {
  return Object.entries(save.stats.misses)
    .sort((a, b) => b[1] - a[1])
    .slice(0, limit || 5);
}
function reportFacts() {
  const st = save.stats;
  const acc = st.rounds ? Math.round(st.perfect / st.rounds * 100) : 0;
  return {
    period: fmtDate(st.weekStart) + " – " + fmtDate(Date.now()),
    rounds: st.rounds,
    accuracy: acc,
    daysPlayed: st.days.length,
    level: level(),
    rank: RANKS[Math.min(level() - 1, RANKS.length - 1)].name,
    workingOn: TIER_DESC[save.tier],
    diamonds: save.diamonds,
    totalRounds: st.totalRounds,
    tricky: trickyWords(5)
  };
}
function reportText() {
  const f = reportFacts();
  const tricky = f.tricky.length
    ? f.tricky.map(([w, n]) => "  - " + w + " (" + n + (n === 1 ? " miss" : " misses") + ")").join("\n")
    : "  none — every word went smoothly!";
  return [
    "WordCraft progress report for " + NAME,
    "Period: " + f.period,
    "",
    "Rounds completed: " + f.rounds,
    "First-try success: " + f.accuracy + "%",
    "Days played: " + f.daysPlayed,
    "Level: " + f.level + " (" + f.rank + ")",
    "Working on: " + f.workingOn,
    "Total diamonds: " + f.diamonds,
    "",
    "Words to practice together:",
    tricky,
    "",
    "Lifetime rounds: " + f.totalRounds
  ].join("\n");
}
function resetWeek() {
  const st = save.stats;
  st.weekStart = Date.now();
  st.rounds = 0;
  st.perfect = 0;
  st.mistakes = 0;
  st.days = [];
  st.misses = {};
  st.lastReportAt = Date.now();
  persist();
}
let sending = false;
function sendReport(onDone) {
  if (!CONFIG.REPORT_ENDPOINT || sending) return;
  sending = true;
  fetch(CONFIG.REPORT_ENDPOINT, {
    method: "POST",
    headers: { "Accept": "application/json", "Content-Type": "application/json" },
    body: JSON.stringify({
      _subject: "WordCraft weekly report: " + NAME,
      message: reportText()
    })
  }).then(res => {
    sending = false;
    if (res.ok) {
      resetWeek();
      if (onDone) onDone(true);
    } else if (onDone) onDone(false);
  }).catch(() => {
    sending = false;
    if (onDone) onDone(false);
  });
}
/* auto-send when the game is opened and the reporting window has elapsed */
function maybeAutoReport() {
  const st = save.stats;
  const due = Date.now() - st.weekStart >= CONFIG.REPORT_EVERY_DAYS * 864e5;
  if (!due) return;
  if (CONFIG.REPORT_ENDPOINT && st.rounds > 0) sendReport();
  else if (!CONFIG.REPORT_ENDPOINT) resetWeek(); /* keep the window rolling weekly */
}
 
/* ---------- grown-ups screen (press & hold to open) ---------- */
function renderParent() {
  const f = reportFacts();
  const rows = [
    ["This week (" + f.period + ")", ""],
    ["Rounds completed", f.rounds],
    ["First-try success", f.accuracy + "%"],
    ["Days played", f.daysPlayed],
    ["Level / rank", f.level + " · " + f.rank],
    ["Working on", f.workingOn],
    ["Diamonds", f.diamonds],
    ["Lifetime rounds", f.totalRounds]
  ];
  const tricky = f.tricky.length
    ? f.tricky.map(([w, n]) => w + " (" + n + ")").join(", ")
    : "none yet";
  $("parentTitle").textContent = NAME.toUpperCase() + "'S PROGRESS";
  $("parentStats").innerHTML =
    rows.map(r => `<div class="row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join("") +
    `<div class="row"><span>Words to practice</span><span>${tricky}</span></div>`;
  const status = $("reportStatus");
  if (CONFIG.REPORT_ENDPOINT) {
    const st = save.stats;
    status.textContent = st.lastReportAt
      ? "Email reports ON — last sent " + fmtDate(st.lastReportAt) + ". Auto-sends when the game is opened after " + CONFIG.REPORT_EVERY_DAYS + "+ days."
      : "Email reports ON — first report will send automatically after " + CONFIG.REPORT_EVERY_DAYS + " days of play.";
    $("sendReportBtn").classList.remove("hidden");
  } else {
    status.textContent = "Email reports are OFF. To get this report emailed weekly, add your free Formspree link in the settings at the top of index.html (see README).";
    $("sendReportBtn").classList.add("hidden");
  }
}
let holdTimer = null;
const parentBtn = $("parentBtn");
function startHold(e) {
  e.preventDefault();
  parentBtn.classList.add("holding");
  holdTimer = setTimeout(() => {
    parentBtn.classList.remove("holding");
    renderParent();
    showScreen("parent");
  }, 1500);
}
function cancelHold() {
  parentBtn.classList.remove("holding");
  clearTimeout(holdTimer);
}
parentBtn.addEventListener("pointerdown", startHold);
parentBtn.addEventListener("pointerup", cancelHold);
parentBtn.addEventListener("pointerleave", cancelHold);
$("parentBackBtn").addEventListener("click", () => {
  renderHome();
  showScreen("home");
});
$("sendReportBtn").addEventListener("click", () => {
  const status = $("reportStatus");
  status.textContent = "Sending…";
  sendReport(ok => {
    status.textContent = ok
      ? "Report sent! Check your email."
      : "Could not send (no internet or bad endpoint). Try again later.";
  });
});
 
/* =====================================================
   WIRING
   ===================================================== */
$("playBtn").addEventListener("click", () => {
  ctx(); /* unlock audio on first user gesture (iOS requirement) */
  sfx.tap();
  say("Let's go mining for words, " + NAME + "!");
  startAdventure();
});
$("quitBtn").addEventListener("click", () => {
  speechSynthesis.cancel();
  renderHome();
  showScreen("home");
});
$("againBtn").addEventListener("click", () => {
  if (maybeLevelUp()) return;
  startAdventure();
});
$("homeBtn").addEventListener("click", () => {
  if (maybeLevelUp()) return;
  renderHome();
  showScreen("home");
});
$("levelupOk").addEventListener("click", () => {
  renderHome();
  showScreen("home");
});
 
$("subtitle").textContent = "⛏️ " + NAME.toUpperCase() + "'S READING ADVENTURE ⛏️";
document.title = "WordCraft — " + NAME + "'s Reading Adventure";
maybeAutoReport();
renderHome();
</script>
